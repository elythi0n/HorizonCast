# cargo-deny configuration. Run: cargo deny check
# Matters because FFmpeg/codec deps can carry GPL/incompatible licenses (see planning docs).

[advisories]
version = 2
ignore = [
    # `paste` (proc-macro, pulled transitively by Slint) is unmaintained but not
    # vulnerable; it's widely used and not removable from the dep tree. Revisit if a
    # maintained replacement propagates upstream.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
confidence-threshold = 0.8
# Our own workspace crates are `publish = false` and not yet licensed (TBD);
# skip them here so the check only governs third-party dependencies.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "NCSA", # permissive (University of Illinois/NCSA) — libfuzzer-sys lockfile straggler
    "BSL-1.0", # Boost Software License — permissive (clipboard-win, error-code via rfd)
    # Slint is tri-licensed (GPL-3.0 OR Royalty-free OR paid). We choose the **royalty-free**
    # arm for the proprietary app — NOT GPL-3.0 (which would force copyleft on HorizonCast).
    # This is a deliberate product-license decision; see the GUI notes. Free for desktop use
    # with an attribution condition; a paid Slint license removes that if ever wanted.
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
