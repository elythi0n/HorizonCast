[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
hc-core = { path = "crates/hc-core" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "fs",
    "io-util",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[workspace.lints.clippy]
# Project-wide lint posture; CI runs `clippy --all-targets -- -D warnings`.
all = { level = "warn", priority = -1 }
