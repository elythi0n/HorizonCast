[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
hc-core = { path = "crates/hc-core" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "fs",
    "io-util",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[workspace.lints.clippy]
# Project-wide lint posture; CI runs `clippy --all-targets -- -D warnings`.
all = { level = "warn", priority = -1 }

# Vendored Slint winit backend with a one-line fix: upstream 1.16.1 guards its macOS frame
# throttle by checking for the CADisplayLink *class* (present on macOS 12/13), then calls the
# `displayLinkWithTarget:selector:` method that only exists on macOS 14+, aborting on 12/13.
# Our copy checks the selector and falls back to the timer throttle. Drop this once a released
# Slint version fixes it upstream. See vendor/i-slint-backend-winit/frame_throttle/macos_display_link.rs.
[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
