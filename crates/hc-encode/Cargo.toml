[package]
name = "hc-encode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# macOS VideoToolbox encoder. Off by default: it's a draft that needs finishing on a real
# Mac, so the default macOS build uses the stub. Enable with `--features videotoolbox`.
videotoolbox = [
    "dep:block2",
    "dep:objc2-core-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-foundation",
    "dep:objc2-video-toolbox",
]

[dependencies]
hc-core.workspace = true
hc-capture = { path = "../hc-capture" }
tracing.workspace = true

# macOS VideoToolbox deps — optional, pulled in only by the `videotoolbox` feature.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true }
objc2-core-media = { version = "0.3.2", optional = true }
objc2-core-video = { version = "0.3.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
objc2-video-toolbox = { version = "0.3.2", optional = true }

# Windows: hardware/software H.264 via Media Foundation (no extra build tools needed).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Media_MediaFoundation",
] }
